<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Albums</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
      }

      body {
        position: fixed;
        inset: 0;
      }

      #collage {
        position: absolute;
        top: 0;
        left: 0;
        display: grid;
        overflow: hidden;
        will-change: transform;
      }

      .tile {
        background-position: center center;
        background-repeat: no-repeat;
        background-size: cover;
      }

      #fallback {
        position: absolute;
        inset: 0;
        display: none;
        align-items: center;
        justify-content: center;
        color: #fff;
        font-family: sans-serif;
        font-size: 14px;
        letter-spacing: 0;
      }

      #layout-toggle {
        position: fixed;
        left: 16px;
        bottom: 16px;
        z-index: 20;
        border: 1px solid rgba(255, 255, 255, 0.5);
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        padding: 8px 10px;
        border-radius: 6px;
        font-family: sans-serif;
        font-size: 12px;
        line-height: 1;
        letter-spacing: 0;
        cursor: pointer;
      }

      #layout-toggle:hover {
        background: rgba(20, 20, 20, 0.85);
      }
    </style>
  </head>
  <body>
    <div id="collage" aria-label="Album collage"></div>
    <div id="fallback">Unable to load album covers.</div>
    <button id="layout-toggle" type="button" aria-label="Toggle collage layout">
      Mode: Random
    </button>

    <script>
      const collage = document.getElementById("collage");
      const fallback = document.getElementById("fallback");
      const layoutToggle = document.getElementById("layout-toggle");
      const MIN_VISIBLE_COLS = 6;
      const MAX_VISIBLE_COLS = 37;
      const MIN_TILE_SIZE = 48;
      const WHEEL_NOTCH_PX = 100;
      let currentUrls = [];
      let visibleCols = null;
      let layoutMode = "random";
      let coverColourMap = new Map();
      let randomOrder = [];
      const hslMemo = new Map();
      let renderState = null;
      let wheelRemainder = 0;

      function normalizeKey(s) {
        return (s || "").normalize("NFKD").toLowerCase().trim();
      }

      function parseCsvLine(line) {
        const fields = [];
        let current = "";
        let inQuotes = false;
        for (let i = 0; i < line.length; i += 1) {
          const ch = line[i];
          if (ch === '"') {
            if (inQuotes && line[i + 1] === '"') {
              current += '"';
              i += 1;
            } else {
              inQuotes = !inQuotes;
            }
            continue;
          }
          if (ch === "," && !inQuotes) {
            fields.push(current);
            current = "";
            continue;
          }
          current += ch;
        }
        fields.push(current);
        return fields;
      }

      function parseCsv(text) {
        const lines = text.split(/\r?\n/).filter((line) => line.trim().length > 0);
        if (!lines.length) return [];
        const headers = parseCsvLine(lines[0]);
        const rows = [];
        for (let i = 1; i < lines.length; i += 1) {
          const values = parseCsvLine(lines[i]);
          const row = {};
          for (let j = 0; j < headers.length; j += 1) {
            row[headers[j]] = values[j] ?? "";
          }
          rows.push(row);
        }
        return rows;
      }

      async function loadCoverColours() {
        if (coverColourMap.size > 0) return coverColourMap;
        const res = await fetch("/data/collection_with_colours.csv", { cache: "no-store" });
        if (!res.ok) return coverColourMap;
        const text = await res.text();
        const rows = parseCsv(text);
        const map = new Map();
        for (const row of rows) {
          const imageFile = (row.ImageFile || "").trim();
          const hex = (row.AlbumColorHex || "").trim().toLowerCase();
          if (!imageFile || !/^#[0-9a-f]{6}$/.test(hex)) continue;
          map.set(normalizeKey(imageFile), hex);
        }
        coverColourMap = map;
        return coverColourMap;
      }

      function extractFilenameFromCoverUrl(url) {
        try {
          const u = new URL(url, window.location.origin);
          const fromParam = u.searchParams.get("pathname");
          const path = fromParam ? decodeURIComponent(fromParam) : decodeURIComponent(u.pathname);
          const parts = path.split("/");
          return parts[parts.length - 1] || "";
        } catch {
          return "";
        }
      }

      function hexToHsl(hex) {
        if (hslMemo.has(hex)) return hslMemo.get(hex);
        const r = parseInt(hex.slice(1, 3), 16) / 255;
        const g = parseInt(hex.slice(3, 5), 16) / 255;
        const b = parseInt(hex.slice(5, 7), 16) / 255;
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        const d = max - min;
        let h = 0;
        const l = (max + min) / 2;
        let s = 0;
        if (d !== 0) {
          s = d / (1 - Math.abs(2 * l - 1));
          switch (max) {
            case r:
              h = ((g - b) / d) % 6;
              break;
            case g:
              h = (b - r) / d + 2;
              break;
            default:
              h = (r - g) / d + 4;
              break;
          }
          h *= 60;
          if (h < 0) h += 360;
        }
        const out = [h, s, l];
        hslMemo.set(hex, out);
        return out;
      }

      function sortUrlsByColour(urls) {
        if (!coverColourMap.size) return urls.slice();
        const withHex = [];
        const withoutHex = [];
        for (const url of urls) {
          const filename = normalizeKey(extractFilenameFromCoverUrl(url));
          const hex = coverColourMap.get(filename);
          if (hex) {
            withHex.push({ url, hex });
          } else {
            withoutHex.push(url);
          }
        }
        withHex.sort((a, b) => {
          const [ha, sa, la] = hexToHsl(a.hex);
          const [hb, sb, lb] = hexToHsl(b.hex);
          if (ha !== hb) return ha - hb;
          if (la !== lb) return la - lb;
          if (sa !== sb) return sa - sb;
          return a.hex.localeCompare(b.hex);
        });
        return withHex.map((x) => x.url).concat(shuffle(withoutHex));
      }

      function diagonalPositions(cols, rows) {
        const out = [];
        for (let sum = 0; sum <= cols + rows - 2; sum += 1) {
          for (let r = 0; r < rows; r += 1) {
            const c = sum - r;
            if (c >= 0 && c < cols) {
              out.push(r * cols + c);
            }
          }
        }
        return out;
      }

      function shuffle(arr) {
        const out = arr.slice();
        for (let i = out.length - 1; i > 0; i -= 1) {
          const j = Math.floor(Math.random() * (i + 1));
          [out[i], out[j]] = [out[j], out[i]];
        }
        return out;
      }

      function pickForGrid(urls, count) {
        if (!urls.length || count <= 0) return [];
        const shuffled = randomOrder.length ? randomOrder : shuffle(urls);
        const selected = [];
        for (let i = 0; i < count; i += 1) {
          selected.push(shuffled[i % shuffled.length]);
        }
        return selected;
      }

      function pickForGridGradient(urls, count, cols, rows) {
        if (!urls.length || count <= 0) return [];
        const sorted = sortUrlsByColour(urls);
        const selected = [];
        for (let i = 0; i < count; i += 1) {
          selected.push(sorted[i % sorted.length]);
        }
        const fills = new Array(count);
        const positions = diagonalPositions(cols, rows);
        for (let i = 0; i < count; i += 1) {
          fills[positions[i]] = selected[i];
        }
        return fills;
      }

      function clampVisibleCols(value, vw) {
        const maxVisibleCols = Math.max(
          MIN_VISIBLE_COLS,
          Math.min(MAX_VISIBLE_COLS, Math.floor(vw / MIN_TILE_SIZE)),
        );
        return Math.min(maxVisibleCols, Math.max(MIN_VISIBLE_COLS, value));
      }

      function clampOffset(offset, viewportSize, gridSize) {
        return Math.min(0, Math.max(viewportSize - gridSize, offset));
      }

      function findClosestIndex(fills, url, preferredIndex = 0) {
        let bestIndex = -1;
        let bestDistance = Number.POSITIVE_INFINITY;
        for (let i = 0; i < fills.length; i += 1) {
          if (fills[i] !== url) continue;
          const d = Math.abs(i - preferredIndex);
          if (d < bestDistance) {
            bestDistance = d;
            bestIndex = i;
          }
        }
        return bestIndex;
      }

      function captureAnchor(clientX, clientY) {
        if (!renderState) return null;
        const { offsetX, offsetY, tileSize, cols, rows, fills } = renderState;
        const relX = clientX - offsetX;
        const relY = clientY - offsetY;
        if (relX < 0 || relY < 0 || relX >= cols * tileSize || relY >= rows * tileSize) {
          return {
            x: clientX,
            y: clientY,
            fx: 0.5,
            fy: 0.5,
            index: null,
            url: null,
          };
        }
        const col = Math.floor(relX / tileSize);
        const row = Math.floor(relY / tileSize);
        const index = row * cols + col;
        return {
          x: clientX,
          y: clientY,
          fx: relX / tileSize - col,
          fy: relY / tileSize - row,
          index,
          url: fills[index] || null,
        };
      }

      function render(urls, options = {}) {
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        if (visibleCols == null) {
          visibleCols = clampVisibleCols(MAX_VISIBLE_COLS, vw);
        } else {
          visibleCols = clampVisibleCols(visibleCols, vw);
        }
        if (typeof options.visibleCols === "number") {
          visibleCols = clampVisibleCols(options.visibleCols, vw);
        }

        const tileSize = Math.ceil(vw / visibleCols);
        const cols = visibleCols + 2;
        const visibleRows = Math.ceil(vh / tileSize);
        const rows = visibleRows + 2;
        const total = cols * rows;
        const fills =
          layoutMode === "gradient"
            ? pickForGridGradient(urls, total, cols, rows)
            : pickForGrid(urls, total);

        const gridW = cols * tileSize;
        const gridH = rows * tileSize;
        let offsetX = Math.floor((vw - gridW) / 2);
        let offsetY = Math.floor((vh - gridH) / 2);

        const anchor = options.anchor;
        if (anchor && (anchor.url || anchor.index != null)) {
          let anchorIndex = -1;
          if (anchor.url) {
            anchorIndex = findClosestIndex(fills, anchor.url, anchor.index ?? 0);
          }
          if (anchorIndex < 0 && anchor.index != null && anchor.index < fills.length) {
            anchorIndex = anchor.index;
          }
          if (anchorIndex >= 0) {
            const anchorCol = anchorIndex % cols;
            const anchorRow = Math.floor(anchorIndex / cols);
            const fx = Number.isFinite(anchor.fx) ? anchor.fx : 0.5;
            const fy = Number.isFinite(anchor.fy) ? anchor.fy : 0.5;
            const tileX = anchorCol * tileSize + fx * tileSize;
            const tileY = anchorRow * tileSize + fy * tileSize;
            offsetX = Math.round(anchor.x - tileX);
            offsetY = Math.round(anchor.y - tileY);
          }
        }

        offsetX = clampOffset(offsetX, vw, gridW);
        offsetY = clampOffset(offsetY, vh, gridH);

        collage.style.width = `${gridW}px`;
        collage.style.height = `${gridH}px`;
        collage.style.gridTemplateColumns = `repeat(${cols}, ${tileSize}px)`;
        collage.style.gridTemplateRows = `repeat(${rows}, ${tileSize}px)`;
        collage.style.transform = `translate(${offsetX}px, ${offsetY}px)`;

        const frag = document.createDocumentFragment();
        for (let i = 0; i < fills.length; i += 1) {
          const tile = document.createElement("div");
          tile.className = "tile";
          tile.style.width = `${tileSize}px`;
          tile.style.height = `${tileSize}px`;
          tile.style.backgroundImage = `url("${fills[i]}")`;
          frag.appendChild(tile);
        }
        collage.replaceChildren(frag);
        renderState = { tileSize, cols, rows, gridW, gridH, offsetX, offsetY, fills };
      }

      function adjustZoomByColumns(stepColumns, anchor) {
        if (!currentUrls.length) return;
        const vw = window.innerWidth;
        const current = visibleCols == null ? clampVisibleCols(MAX_VISIBLE_COLS, vw) : visibleCols;
        const next = clampVisibleCols(current + stepColumns, vw);
        if (next === visibleCols) return;
        render(currentUrls, { visibleCols: next, anchor });
      }

      function normalizeWheelDelta(event) {
        let delta = event.deltaY;
        if (event.deltaMode === 1) delta *= 40;
        if (event.deltaMode === 2) delta *= window.innerHeight;
        return delta;
      }

      function probeImage(url, timeoutMs = 5000) {
        return new Promise((resolve) => {
          const img = new Image();
          let done = false;

          const finish = (ok) => {
            if (done) return;
            done = true;
            resolve(ok);
          };

          const timer = setTimeout(() => finish(false), timeoutMs);
          img.onload = () => {
            clearTimeout(timer);
            finish(true);
          };
          img.onerror = () => {
            clearTimeout(timer);
            finish(false);
          };
          img.referrerPolicy = "no-referrer";
          img.src = url;
        });
      }

      async function hasLoadableImages(urls) {
        const sample = urls.slice(0, Math.min(8, urls.length));
        const checks = await Promise.all(sample.map((u) => probeImage(u)));
        return checks.some(Boolean);
      }

      async function loadAndRender() {
        try {
          const res = await fetch("/api/collectiv-covers", { cache: "no-store" });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          const payload = await res.json();
          const urls = Array.isArray(payload?.urls) ? payload.urls : [];
          if (!urls.length) throw new Error("No covers found");
          await loadCoverColours();
          const accessible = await hasLoadableImages(urls);
          if (!accessible) throw new Error("Covers are not publicly accessible");
          currentUrls = urls;
          randomOrder = shuffle(urls);
          fallback.style.display = "none";
          render(currentUrls);
        } catch (err) {
          collage.replaceChildren();
          currentUrls = [];
          randomOrder = [];
          renderState = null;
          const detail = err instanceof Error ? err.message : "Unknown error";
          fallback.textContent = `Unable to load album covers: ${detail}`;
          fallback.style.display = "flex";
        }
      }

      let resizeTimer;
      window.addEventListener("resize", () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(() => {
          if (!currentUrls.length) {
            loadAndRender();
            return;
          }
          render(currentUrls);
        }, 120);
      });

      window.addEventListener(
        "wheel",
        (event) => {
          event.preventDefault();
          if (!currentUrls.length) return;
          const anchor = captureAnchor(event.clientX, event.clientY);
          wheelRemainder += normalizeWheelDelta(event);
          let steps = 0;
          while (Math.abs(wheelRemainder) >= WHEEL_NOTCH_PX) {
            const sign = wheelRemainder > 0 ? 1 : -1;
            wheelRemainder -= sign * WHEEL_NOTCH_PX;
            steps += sign;
          }
          if (steps !== 0) {
            adjustZoomByColumns(steps, anchor);
          }
        },
        { passive: false },
      );

      layoutToggle.addEventListener("click", () => {
        layoutMode = layoutMode === "random" ? "gradient" : "random";
        layoutToggle.textContent =
          layoutMode === "gradient" ? "Mode: Colour Gradient" : "Mode: Random";
        if (currentUrls.length) render(currentUrls);
      });

      loadAndRender();
    </script>
  </body>
</html>
