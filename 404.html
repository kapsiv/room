<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Page not found — KAPSIV</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        overflow: hidden;
        background: #dacebe;
      }

      main {
        display: grid;
        width: 100vw;
        height: 100vh;
        height: 100dvh;
        place-items: center;
      }

      .not-found-artwork {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
    </style>
  </head>
  <body>
    <main>
      <object
        class="not-found-artwork"
        data="/svgs/404.svg"
        type="image/svg+xml"
        aria-label="Page not found. Go home."
      >
        <a href="/">go home</a>
      </object>
    </main>
  </body>
</html>
